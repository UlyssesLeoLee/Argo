<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Argo · 帮助</title><style>body{font:15px/1.85 system-ui;background:#FAF8F3;color:#243B54;max-width:940px;margin:48px auto;padding:0 20px}code{background:#e9eee0;padding:3px 7px;border-radius:5px}a{color:#315f6b}</style><h1>Argo v0.3 使用说明</h1><p>首页一次只配置一个 Agent。文件机器→仓库→路径在同一区域，执行机器另设。选择 STAR 时需先在 Worker 配置可信 HTTPS Webhook；STAR 目前处于预发布占位阶段。</p><p>个人 RAG 先采集与审核，再同步外部知识库。「AI 智能整理」需要临时个人 API Key，先预览，再确认批量应用；所有 AI 改写会退回待审核，并保留版本快照。</p><p>演示预览：<code>?demo=1</code>。正式跨机器通信需要 TLS/VPN 和独立服务端凭据。完整 API 与测试设计见项目 <code>README.md</code>、<code>docs/</code>。</p></html>
